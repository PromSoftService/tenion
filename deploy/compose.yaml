name: pss-tenion

services:
  api:
    image: ${TENION_API_IMAGE:?Set TENION_API_IMAGE in .env}
    container_name: pss-tenion-api
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - /srv/pss/data/tenion:/srv/tenion/data
    mem_limit: 384m
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

